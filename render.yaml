services:
  - type: web
    name: meditrack
    runtime: python
    plan: starter   
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    disk:
      name: meditrack-data
      mountPath: /opt/render/project/src/app/static/uploads
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "False"
      - key: USE_CLOUD
        value: "True"
      - key: SYNC_INTERVAL_SECONDS
        value: "300"
      - key: APP_BASE_URL
        sync: false   
      - key: SECRET_KEY
        generateValue: true   
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SEED_DEMO_DATA
        value: "False"   
